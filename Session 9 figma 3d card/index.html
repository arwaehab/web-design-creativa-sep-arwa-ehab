<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipping-Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card-wrapper">
        <div class="card">
           <!-- front-card --> 
            <div class="front-card">
            <h2> Financial Sector <br>
                Development <br>
                Program
            </h2>
            <button class="front-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
            </div>

            <!-- back-card -->
             <div class="back-card">
                <i class="fa-solid fa-chart-line"></i>
             <h2> Financial Sector <br>
                Development <br>
                Program
            </h2>
            <p>
                The Program aims to diversified and effective financial sector to support the development of the Saudi Arabia's economy
            </p>
            <div class="back-footer">
                <a href="#">Read-more</a>
                <button>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
             </div>
        </div>    
    </div>
</body>
</html>
